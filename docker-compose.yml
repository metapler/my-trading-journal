services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: trading_journal
      POSTGRES_PASSWORD: trading_journal
      POSTGRES_DB: trading_journal
    ports:
      - "5432:5432"
    volumes:
      - trading_journal_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading_journal -d trading_journal"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  trading_journal_data:
